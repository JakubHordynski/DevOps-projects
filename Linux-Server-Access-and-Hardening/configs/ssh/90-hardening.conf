AllowGroups ssh-users sudo
AllowUsers 10.0.2.2
AllowUsers *@192.168.0.0/16
DenyUsers *@172.16.0.0/12

Port 6969

Ciphers -3des-cbc,aes128-cbc,aes192-cbc,aes256-cbc,aes128-ctr,aes192-ctr
PubkeyAuthentication yes
PasswordAuthentication no
AllowTcpForwarding no
GatewayPorts no
X11Forwarding no

Match Group PassAuthAny
    PasswordAuthentication yes

Match Group PassAuthInternal Address 10.0.0.0/8
    PasswordAuthentication yes

Match Group PortForwarding
    AllowTcpForwarding yes

Match Group GatewayListening
    AllowTcpForwarding yes
    GatewayPorts yes

Match Group X11Users
    X11Forwarding yes
